# GitLab CI/CD Pipeline - Invoice Ninja GCP Production
# Self-contained pipeline for validating the Docker setup, building images,
# scanning for issues, and deploying the Cloud Run web service.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: ""
  GCP_REGION: "us-central1"
  ARTIFACT_REGISTRY_REPOSITORY: "invoiceninja"
  REGISTRY_URL: "${GCP_REGION}-docker.pkg.dev"
  WEB_IMAGE: "${REGISTRY_URL}/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/web"
  WORKER_IMAGE: "${REGISTRY_URL}/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/worker"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  DB_DATABASE_NAME: "invoiceninja"
  DB_USERNAME: "invoiceninja"
  DB_PORT: "5432"
  CONCURRENCY: "80"

cache:
  - key: "composer-${CI_COMMIT_REF_SLUG}"
    paths:
      - invoiceninja/vendor/
    policy: pull-push
  - key: "trivy-db"
    paths:
      - .trivycache/
    policy: pull-push
  - key: "terraform-${CI_COMMIT_REF_SLUG}"
    paths:
      - terraform/environments/*/.terraform/
    policy: pull-push

stages:
  - validate
  - test
  - infrastructure-plan
  - infrastructure-apply
  - build
  - security
  - deploy
  - verify

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  interruptible: true

.submodule_setup:
  before_script:
    - |
      if ! command -v git >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache git
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y git
        fi
      fi
    - |
      # Ensure any leftover submodule checkout from caches is removed
      if [ -d invoiceninja ]; then
        rm -rf invoiceninja
      fi
    - git submodule sync --recursive
    - git submodule update --init --recursive --force --depth 1

.docker_build_template:
  stage: build
  image: docker:24.0.7-git
  services:
    - name: docker:24.0.7-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
  extends: .submodule_setup
  before_script:
    - !reference [.submodule_setup, before_script]
    - |
      if [ -z "${GCP_SERVICE_KEY:-}" ]; then
        echo "GCP_SERVICE_KEY is required to push images to Artifact Registry"
        exit 1
      fi
    - echo "$GCP_SERVICE_KEY" | docker login -u _json_key --password-stdin "https://${REGISTRY_URL}"
  script:
    - docker pull "$IMAGE_NAME:latest" || true
    - docker pull "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" || true
    - docker build --pull --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$IMAGE_NAME:latest" --cache-from "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" -f "$DOCKERFILE_PATH" -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" .
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHA" "$IMAGE_NAME:latest"
      fi
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$IMAGE_NAME:latest"
      fi

.gcloud_deploy_template:
  image: google/cloud-sdk:slim
  extends: .submodule_setup
  before_script:
    - !reference [.submodule_setup, before_script]
    - |
      if [ -z "${GCP_SERVICE_KEY:-}" ]; then
        echo "GCP_SERVICE_KEY is required to deploy to Cloud Run"
        exit 1
      fi
    - printf '%s' "$GCP_SERVICE_KEY" > /tmp/gcp-service-key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp-service-key.json
    - gcloud config set project "$GCP_PROJECT_ID"

validate:compose:
  stage: validate
  image: docker:24.0.7-git
  needs: []
  services:
    - name: docker:24.0.7-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - apk add --no-cache docker-cli-compose
    - docker compose config >/dev/null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test:composer:
  stage: test
  image: composer:2.6
  needs: []
  extends: .submodule_setup
  script:
    - cd invoiceninja
    - composer validate
    - composer install --no-interaction --no-progress --prefer-dist --no-dev --no-scripts --ignore-platform-reqs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:web:
  extends: .docker_build_template
  needs: []
  timeout: 15m
  variables:
    IMAGE_NAME: "$WEB_IMAGE"
    DOCKERFILE_PATH: "docker/web/Dockerfile"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

build:worker:
  extends: .docker_build_template
  needs: []
  timeout: 15m
  variables:
    IMAGE_NAME: "$WORKER_IMAGE"
    DOCKERFILE_PATH: "docker/worker/Dockerfile"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

security:trivy:
  stage: security
  needs: []
  timeout: 10m
  image:
    name: aquasec/trivy:0.62.0
    entrypoint: [""]
  script:
    - trivy fs --cache-dir "$TRIVY_CACHE_DIR" --skip-dirs "invoiceninja/vendor" --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy:web:dev:
  stage: deploy
  extends: .gcloud_deploy_template
  needs:
    - build:web
    - build:worker
    - tf:apply:dev
  timeout: 15m
  resource_group: deploy-dev
  variables:
    CLOUD_RUN_SERVICE_NAME: "invoice-ninja-web"
    CLOUD_RUN_URL: "${CLOUD_RUN_URL_DEV}"
    CLOUD_RUN_SERVICE_ACCOUNT: "${CLOUD_RUN_WEB_SA}"
    APP_ENV: "development"
    APP_DEBUG: "true"
    CACHE_DRIVER: "file"
    QUEUE_CONNECTION: "database"
    MIN_INSTANCES: "0"
    MAX_INSTANCES: "5"
    MEMORY_LIMIT: "512Mi"
    CPU_LIMIT: "1"
    APP_KEY_SECRET: "invoice-ninja-dev-app-key"
    DB_PASSWORD_SECRET: "invoice-ninja-dev-db-password"
    SMTP_PASSWORD_SECRET: "invoice-ninja-dev-smtp-password"
    STRIPE_KEY_SECRET: "invoice-ninja-dev-stripe-key"
  script:
    - |
      gcloud run deploy "$CLOUD_RUN_SERVICE_NAME" \
        --image "$WEB_IMAGE:$CI_COMMIT_SHA" \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --service-account "$CLOUD_RUN_SERVICE_ACCOUNT" \
        --vpc-connector "$VPC_CONNECTOR" \
        --add-cloudsql-instances "$CLOUD_SQL_CONNECTION_NAME" \
        --set-env-vars "APP_ENV=${APP_ENV},APP_DEBUG=${APP_DEBUG},APP_URL=${CLOUD_RUN_URL},DB_CONNECTION=pgsql,DB_HOST=/cloudsql/${CLOUD_SQL_CONNECTION_NAME},DB_PORT=${DB_PORT},DB_DATABASE=${DB_DATABASE_NAME},DB_USERNAME=${DB_USERNAME},CACHE_DRIVER=${CACHE_DRIVER},QUEUE_CONNECTION=${QUEUE_CONNECTION}" \
        --set-secrets "APP_KEY=${APP_KEY_SECRET}:latest,DB_PASSWORD=${DB_PASSWORD_SECRET}:latest,SMTP_PASSWORD=${SMTP_PASSWORD_SECRET}:latest,STRIPE_KEY=${STRIPE_KEY_SECRET}:latest" \
        --memory "$MEMORY_LIMIT" \
        --cpu "$CPU_LIMIT" \
        --min-instances "$MIN_INSTANCES" \
        --max-instances "$MAX_INSTANCES" \
        --concurrency "$CONCURRENCY" \
        --timeout 300 \
        --quiet
  environment:
    name: dev
    url: $CLOUD_RUN_URL_DEV
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

