verify:web:dev:
  stage: verify
  image: curlimages/curl:8.8.0
  needs:
    - deploy:web:dev
  script:
    - |
      if [ -z "${CLOUD_RUN_URL_DEV:-}" ]; then
        echo "CLOUD_RUN_URL_DEV not set — skipping verification"
        exit 0
      fi
    - curl -fsS --retry 3 --retry-delay 5 "$CLOUD_RUN_URL_DEV/health"
  environment:
    name: dev
    url: $CLOUD_RUN_URL_DEV
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

